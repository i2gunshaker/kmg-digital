<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 858" width="400" height="858" role="img" aria-label="Три режима притока и условия решения" font-family="'Segoe UI','Noto Sans',system-ui,-apple-system,Roboto,sans-serif">
<title>Три режима притока и условия решения</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L10 5L0 9z" fill="#4DC4BF"/></marker><marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L10 5L0 9z" fill="#ECEFF4"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#95A5A6" stroke-width="2"/></pattern><pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.3" fill="#0F1419"/><circle cx="8" cy="8" r="1.1" fill="#0F1419"/></pattern><pattern id="dash" width="14" height="8" patternUnits="userSpaceOnUse"><line x1="1" y1="4" x2="9" y2="4" stroke="#0F1419" stroke-width="1.4"/></pattern><pattern id="brick" width="24" height="14" patternUnits="userSpaceOnUse"><path d="M0 0H24M0 7H24M6 0V7M18 7V14" stroke="#0F1419" stroke-width="1.1" fill="none"/></pattern></defs>
<rect width="400" height="858" rx="10" fill="#0F1419"/>
<rect x="18.0" y="14.0" width="75.9" height="28.0" rx="14" fill="#8E44AD" fill-opacity="1.0" stroke="none" stroke-width="1.2"/>
<text x="55.9" y="33.0" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">схема</text>
<text x="18.0" y="70.0" font-size="19" fill="#ECEFF4" text-anchor="start" font-weight="700">Три режима притока и условия</text>
<text x="18.0" y="95.0" font-size="19" fill="#ECEFF4" text-anchor="start" font-weight="700">решения</text>
<g transform="translate(0 112.0)">
<rect x="18.0" y="12.0" width="364.0" height="64.1" rx="10" fill="#153736" fill-opacity="1.0" stroke="#4DC4BF" stroke-width="2"/>
<text x="32.0" y="39.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Три режима притока и условия</text>
<text x="32.0" y="62.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">решения</text>
<rect x="64.0" y="90.1" width="318.0" height="121.7" rx="10" fill="#1A2129" fill-opacity="1.0" stroke="#4DC4BF" stroke-width="2"/>
<line x1="36.0" y1="150.9" x2="62.0" y2="150.9" stroke="#4DC4BF" stroke-width="2.2" marker-end="url(#ar)"/>
<text x="78.0" y="115.1" font-size="17" fill="#4DC4BF" text-anchor="start" font-weight="700">решение при постоянном дебите</text>
<text x="78.0" y="136.8" font-size="16" fill="#ECEFF4" text-anchor="start">Решение уравнения давления для</text>
<text x="78.0" y="157.3" font-size="16" fill="#ECEFF4" text-anchor="start">скважины, которая работает с</text>
<text x="78.0" y="177.8" font-size="16" fill="#ECEFF4" text-anchor="start">постоянным дебитом у ствола</text>
<text x="78.0" y="198.3" font-size="16" fill="#ECEFF4" text-anchor="start">после начального…</text>
<rect x="64.0" y="225.8" width="318.0" height="101.2" rx="10" fill="#1A2129" fill-opacity="1.0" stroke="#4DC4BF" stroke-width="2"/>
<line x1="36.0" y1="276.4" x2="62.0" y2="276.4" stroke="#4DC4BF" stroke-width="2.2" marker-end="url(#ar)"/>
<text x="78.0" y="250.8" font-size="17" fill="#4DC4BF" text-anchor="start" font-weight="700">неустановившийся режим</text>
<text x="78.0" y="272.5" font-size="16" fill="#ECEFF4" text-anchor="start">Ранний период после возмущения</text>
<text x="78.0" y="293.0" font-size="16" fill="#ECEFF4" text-anchor="start">давления, когда граница ещё не</text>
<text x="78.0" y="313.5" font-size="16" fill="#ECEFF4" text-anchor="start">влияет на давление у скважины</text>
<rect x="64.0" y="341.0" width="318.0" height="121.7" rx="10" fill="#1A2129" fill-opacity="1.0" stroke="#4DC4BF" stroke-width="2"/>
<line x1="36.0" y1="401.8" x2="62.0" y2="401.8" stroke="#4DC4BF" stroke-width="2.2" marker-end="url(#ar)"/>
<text x="78.0" y="366.0" font-size="17" fill="#4DC4BF" text-anchor="start" font-weight="700">псевдоустановившийся режим</text>
<text x="78.0" y="387.7" font-size="16" fill="#ECEFF4" text-anchor="start">Режим, когда эффект внешней</text>
<text x="78.0" y="408.2" font-size="16" fill="#ECEFF4" text-anchor="start">границы дошёл до скважины и</text>
<text x="78.0" y="428.7" font-size="16" fill="#ECEFF4" text-anchor="start">скорость падения давления</text>
<text x="78.0" y="449.2" font-size="16" fill="#ECEFF4" text-anchor="start">одинакова по объёму</text>
<rect x="64.0" y="476.6" width="318.0" height="101.2" rx="10" fill="#1A2129" fill-opacity="1.0" stroke="#4DC4BF" stroke-width="2"/>
<line x1="36.0" y1="527.2" x2="62.0" y2="527.2" stroke="#4DC4BF" stroke-width="2.2" marker-end="url(#ar)"/>
<text x="78.0" y="501.6" font-size="17" fill="#4DC4BF" text-anchor="start" font-weight="700">установившийся режим</text>
<text x="78.0" y="523.4" font-size="16" fill="#ECEFF4" text-anchor="start">Режим при открытой внешней</text>
<text x="78.0" y="543.9" font-size="16" fill="#ECEFF4" text-anchor="start">границе, где отбор компенсируется</text>
<text x="78.0" y="564.4" font-size="16" fill="#ECEFF4" text-anchor="start">притоком через неё</text>
<rect x="64.0" y="591.8" width="318.0" height="101.2" rx="10" fill="#1A2129" fill-opacity="1.0" stroke="#4DC4BF" stroke-width="2"/>
<line x1="36.0" y1="642.4" x2="62.0" y2="642.4" stroke="#4DC4BF" stroke-width="2.2" marker-end="url(#ar)"/>
<text x="78.0" y="616.8" font-size="17" fill="#4DC4BF" text-anchor="start" font-weight="700">контур питания</text>
<text x="78.0" y="638.6" font-size="16" fill="#ECEFF4" text-anchor="start">Внешняя граница дренируемой</text>
<text x="78.0" y="659.1" font-size="16" fill="#ECEFF4" text-anchor="start">зоны вокруг скважины, на которой</text>
<text x="78.0" y="679.6" font-size="16" fill="#ECEFF4" text-anchor="start">задаётся условие для давления</text>
<line x1="36.0" y1="76.1" x2="36.0" y2="642.4" stroke="#4DC4BF" stroke-width="2.2"/>
</g>
<text x="18.0" y="833.0" font-size="16" fill="#AEB9C5" text-anchor="start">по тексту главы, стр. 76–78</text>
</svg>
