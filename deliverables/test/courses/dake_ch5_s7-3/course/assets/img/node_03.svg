<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 707" width="560" height="707" role="img" aria-label="Три режима притока и условия решения" font-family="'Segoe UI','Noto Sans',system-ui,-apple-system,Roboto,sans-serif">
<title>Три режима притока и условия решения</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L10 5L0 9z" fill="#4DC4BF"/></marker><marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L10 5L0 9z" fill="#ECEFF4"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#95A5A6" stroke-width="2"/></pattern><pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.3" fill="#0F1419"/><circle cx="8" cy="8" r="1.1" fill="#0F1419"/></pattern><pattern id="dash" width="14" height="8" patternUnits="userSpaceOnUse"><line x1="1" y1="4" x2="9" y2="4" stroke="#0F1419" stroke-width="1.4"/></pattern><pattern id="brick" width="24" height="14" patternUnits="userSpaceOnUse"><path d="M0 0H24M0 7H24M6 0V7M18 7V14" stroke="#0F1419" stroke-width="1.1" fill="none"/></pattern></defs>
<rect width="560" height="707" rx="10" fill="#0F1419"/>
<rect x="18.0" y="14.0" width="75.9" height="28.0" rx="14" fill="#8E44AD" fill-opacity="1.0" stroke="none" stroke-width="1.2"/>
<text x="55.9" y="33.0" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">схема</text>
<text x="18.0" y="70.0" font-size="19" fill="#ECEFF4" text-anchor="start" font-weight="700">Три режима притока и условия решения</text>
<g transform="translate(0 87.0)">
<rect x="18.0" y="12.0" width="524.0" height="41.0" rx="10" fill="#153736" fill-opacity="1.0" stroke="#4DC4BF" stroke-width="2"/>
<text x="32.0" y="39.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Три режима притока и условия решения</text>
<rect x="64.0" y="67.0" width="478.0" height="101.2" rx="10" fill="#1A2129" fill-opacity="1.0" stroke="#4DC4BF" stroke-width="2"/>
<line x1="36.0" y1="117.6" x2="62.0" y2="117.6" stroke="#4DC4BF" stroke-width="2.2" marker-end="url(#ar)"/>
<text x="78.0" y="92.0" font-size="17" fill="#4DC4BF" text-anchor="start" font-weight="700">решение при постоянном дебите</text>
<text x="78.0" y="113.8" font-size="16" fill="#ECEFF4" text-anchor="start">Решение уравнения давления для скважины, которая</text>
<text x="78.0" y="134.3" font-size="16" fill="#ECEFF4" text-anchor="start">работает с постоянным дебитом у ствола после</text>
<text x="78.0" y="154.8" font-size="16" fill="#ECEFF4" text-anchor="start">начального…</text>
<rect x="64.0" y="182.2" width="478.0" height="80.7" rx="10" fill="#1A2129" fill-opacity="1.0" stroke="#4DC4BF" stroke-width="2"/>
<line x1="36.0" y1="222.6" x2="62.0" y2="222.6" stroke="#4DC4BF" stroke-width="2.2" marker-end="url(#ar)"/>
<text x="78.0" y="207.2" font-size="17" fill="#4DC4BF" text-anchor="start" font-weight="700">неустановившийся режим</text>
<text x="78.0" y="229.0" font-size="16" fill="#ECEFF4" text-anchor="start">Ранний период после возмущения давления, когда</text>
<text x="78.0" y="249.5" font-size="16" fill="#ECEFF4" text-anchor="start">граница ещё не влияет на давление у скважины</text>
<rect x="64.0" y="277.0" width="478.0" height="101.2" rx="10" fill="#1A2129" fill-opacity="1.0" stroke="#4DC4BF" stroke-width="2"/>
<line x1="36.0" y1="327.6" x2="62.0" y2="327.6" stroke="#4DC4BF" stroke-width="2.2" marker-end="url(#ar)"/>
<text x="78.0" y="302.0" font-size="17" fill="#4DC4BF" text-anchor="start" font-weight="700">псевдоустановившийся режим</text>
<text x="78.0" y="323.7" font-size="16" fill="#ECEFF4" text-anchor="start">Режим, когда эффект внешней границы дошёл до</text>
<text x="78.0" y="344.2" font-size="16" fill="#ECEFF4" text-anchor="start">скважины и скорость падения давления одинакова по</text>
<text x="78.0" y="364.7" font-size="16" fill="#ECEFF4" text-anchor="start">объёму</text>
<rect x="64.0" y="392.2" width="478.0" height="80.7" rx="10" fill="#1A2129" fill-opacity="1.0" stroke="#4DC4BF" stroke-width="2"/>
<line x1="36.0" y1="432.5" x2="62.0" y2="432.5" stroke="#4DC4BF" stroke-width="2.2" marker-end="url(#ar)"/>
<text x="78.0" y="417.2" font-size="17" fill="#4DC4BF" text-anchor="start" font-weight="700">установившийся режим</text>
<text x="78.0" y="438.9" font-size="16" fill="#ECEFF4" text-anchor="start">Режим при открытой внешней границе, где отбор</text>
<text x="78.0" y="459.4" font-size="16" fill="#ECEFF4" text-anchor="start">компенсируется притоком через неё</text>
<rect x="64.0" y="486.9" width="478.0" height="80.7" rx="10" fill="#1A2129" fill-opacity="1.0" stroke="#4DC4BF" stroke-width="2"/>
<line x1="36.0" y1="527.2" x2="62.0" y2="527.2" stroke="#4DC4BF" stroke-width="2.2" marker-end="url(#ar)"/>
<text x="78.0" y="511.9" font-size="17" fill="#4DC4BF" text-anchor="start" font-weight="700">контур питания</text>
<text x="78.0" y="533.6" font-size="16" fill="#ECEFF4" text-anchor="start">Внешняя граница дренируемой зоны вокруг скважины,</text>
<text x="78.0" y="554.1" font-size="16" fill="#ECEFF4" text-anchor="start">на которой задаётся условие для давления</text>
<line x1="36.0" y1="53.0" x2="36.0" y2="527.2" stroke="#4DC4BF" stroke-width="2.2"/>
</g>
<text x="18.0" y="682.6" font-size="16" fill="#AEB9C5" text-anchor="start">по тексту главы, стр. 76–78</text>
</svg>
