<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 677" width="400" height="677" role="img" aria-label="Предварительный просмотр каротажа" font-family="'Segoe UI','Noto Sans',system-ui,-apple-system,Roboto,sans-serif">
<title>Предварительный просмотр каротажа</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L10 5L0 9z" fill="#4DC4BF"/></marker><marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L10 5L0 9z" fill="#ECEFF4"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#95A5A6" stroke-width="2"/></pattern><pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.3" fill="#0F1419"/><circle cx="8" cy="8" r="1.1" fill="#0F1419"/></pattern><pattern id="dash" width="14" height="8" patternUnits="userSpaceOnUse"><line x1="1" y1="4" x2="9" y2="4" stroke="#0F1419" stroke-width="1.4"/></pattern><pattern id="brick" width="24" height="14" patternUnits="userSpaceOnUse"><path d="M0 0H24M0 7H24M6 0V7M18 7V14" stroke="#0F1419" stroke-width="1.1" fill="none"/></pattern></defs>
<rect width="400" height="677" rx="10" fill="#0F1419"/>
<rect x="18.0" y="14.0" width="75.9" height="28.0" rx="14" fill="#8E44AD" fill-opacity="1.0" stroke="none" stroke-width="1.2"/>
<text x="55.9" y="33.0" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">схема</text>
<text x="18.0" y="70.0" font-size="19" fill="#ECEFF4" text-anchor="start" font-weight="700">Предварительный просмотр</text>
<text x="18.0" y="95.0" font-size="19" fill="#ECEFF4" text-anchor="start" font-weight="700">каротажа</text>
<g transform="translate(0 112.0)">
<rect x="18.0" y="14.0" width="364.0" height="85.3" rx="10" fill="#1A2129" fill-opacity="1.0" stroke="#4DC4BF" stroke-width="2"/>
<circle cx="50.0" cy="56.6" r="17.0" fill="#4DC4BF" fill-opacity="1.0" stroke="none" stroke-width="1.2"/>
<text x="50.0" y="62.6" font-size="18" fill="#0F1419" text-anchor="middle" font-weight="700">1</text>
<text x="82.0" y="39.0" font-size="17" fill="#ECEFF4" text-anchor="start">Выбрать ветку схемы:</text>
<text x="82.0" y="60.8" font-size="17" fill="#ECEFF4" text-anchor="start">терригенный или карбонатный</text>
<text x="82.0" y="82.5" font-size="17" fill="#ECEFF4" text-anchor="start">разрез</text>
<line x1="200.0" y1="101.3" x2="200.0" y2="119.3" stroke="#4DC4BF" stroke-width="2.2" marker-end="url(#ar)"/>
<rect x="18.0" y="123.3" width="364.0" height="85.3" rx="10" fill="#1A2129" fill-opacity="1.0" stroke="#4DC4BF" stroke-width="2"/>
<circle cx="50.0" cy="165.9" r="17.0" fill="#4DC4BF" fill-opacity="1.0" stroke="none" stroke-width="1.2"/>
<text x="50.0" y="171.9" font-size="18" fill="#0F1419" text-anchor="middle" font-weight="700">2</text>
<text x="82.0" y="148.3" font-size="17" fill="#ECEFF4" text-anchor="start">Отметить пласты, где</text>
<text x="82.0" y="170.0" font-size="17" fill="#ECEFF4" text-anchor="start">сопротивление заметно</text>
<text x="82.0" y="191.8" font-size="17" fill="#ECEFF4" text-anchor="start">выделяется на фоне глин</text>
<line x1="200.0" y1="210.6" x2="200.0" y2="228.6" stroke="#4DC4BF" stroke-width="2.2" marker-end="url(#ar)"/>
<rect x="18.0" y="232.6" width="364.0" height="63.5" rx="10" fill="#1A2129" fill-opacity="1.0" stroke="#4DC4BF" stroke-width="2"/>
<circle cx="50.0" cy="264.3" r="17.0" fill="#4DC4BF" fill-opacity="1.0" stroke="none" stroke-width="1.2"/>
<text x="50.0" y="270.3" font-size="18" fill="#0F1419" text-anchor="middle" font-weight="700">3</text>
<text x="82.0" y="257.6" font-size="17" fill="#ECEFF4" text-anchor="start">Найти пористые зоны по кривой</text>
<text x="82.0" y="279.3" font-size="17" fill="#ECEFF4" text-anchor="start">пористости</text>
<line x1="200.0" y1="298.1" x2="200.0" y2="316.1" stroke="#4DC4BF" stroke-width="2.2" marker-end="url(#ar)"/>
<rect x="18.0" y="320.1" width="364.0" height="85.3" rx="10" fill="#1A2129" fill-opacity="1.0" stroke="#4DC4BF" stroke-width="2"/>
<circle cx="50.0" cy="362.7" r="17.0" fill="#4DC4BF" fill-opacity="1.0" stroke="none" stroke-width="1.2"/>
<text x="50.0" y="368.7" font-size="18" fill="#0F1419" text-anchor="middle" font-weight="700">4</text>
<text x="82.0" y="345.1" font-size="17" fill="#ECEFF4" text-anchor="start">При наличии нейтронного и</text>
<text x="82.0" y="366.8" font-size="17" fill="#ECEFF4" text-anchor="start">плотностного каротажа уточнить</text>
<text x="82.0" y="388.6" font-size="17" fill="#ECEFF4" text-anchor="start">литологию и, иногда, тип флюида</text>
</g>
<text x="18.0" y="652.6" font-size="16" fill="#AEB9C5" text-anchor="start">по тексту главы, стр. 126–141</text>
</svg>
