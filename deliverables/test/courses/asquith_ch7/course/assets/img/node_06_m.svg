<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 607" width="400" height="607" role="img" aria-label="Rxo/Rt относительно ПС в водяной и нефтяной зоне" font-family="'Segoe UI','Noto Sans',system-ui,-apple-system,Roboto,sans-serif">
<title>Rxo/Rt относительно ПС в водяной и нефтяной зоне</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L10 5L0 9z" fill="#4DC4BF"/></marker><marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L10 5L0 9z" fill="#ECEFF4"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#95A5A6" stroke-width="2"/></pattern><pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.3" fill="#0F1419"/><circle cx="8" cy="8" r="1.1" fill="#0F1419"/></pattern><pattern id="dash" width="14" height="8" patternUnits="userSpaceOnUse"><line x1="1" y1="4" x2="9" y2="4" stroke="#0F1419" stroke-width="1.4"/></pattern><pattern id="brick" width="24" height="14" patternUnits="userSpaceOnUse"><path d="M0 0H24M0 7H24M6 0V7M18 7V14" stroke="#0F1419" stroke-width="1.1" fill="none"/></pattern></defs>
<rect width="400" height="607" rx="10" fill="#0F1419"/>
<rect x="18.0" y="14.0" width="75.9" height="28.0" rx="14" fill="#8E44AD" fill-opacity="1.0" stroke="none" stroke-width="1.2"/>
<text x="55.9" y="33.0" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">схема</text>
<text x="18.0" y="70.0" font-size="19" fill="#ECEFF4" text-anchor="start" font-weight="700">Rxo/Rt относительно ПС в водяной</text>
<text x="18.0" y="95.0" font-size="19" fill="#ECEFF4" text-anchor="start" font-weight="700">и нефтяной зоне</text>
<g transform="translate(0 112.0)">
<rect x="18.0" y="14.0" width="364.0" height="104.6" rx="10" fill="#1A2129" fill-opacity="1.0" stroke="#2ECC71" stroke-width="2"/>
<text x="32.0" y="42.0" font-size="18" fill="#2ECC71" text-anchor="start" font-weight="700">Водяная зона</text>
<text x="32.0" y="68.0" font-size="17" fill="#ECEFF4" text-anchor="start">• Rxo/Rt идёт за ПС</text>
<text x="32.0" y="94.8" font-size="17" fill="#ECEFF4" text-anchor="start">• обе кривые смещены в одну сторону</text>
<rect x="18.0" y="130.6" width="364.0" height="131.3" rx="10" fill="#1A2129" fill-opacity="1.0" stroke="#F0AD4E" stroke-width="2"/>
<text x="32.0" y="158.6" font-size="18" fill="#F0AD4E" text-anchor="start" font-weight="700">Углеводороды</text>
<text x="32.0" y="184.6" font-size="17" fill="#ECEFF4" text-anchor="start">• Rt растёт, Rxo/Rt падает</text>
<text x="32.0" y="211.4" font-size="17" fill="#ECEFF4" text-anchor="start">• кривая уходит от ПС</text>
<text x="32.0" y="238.1" font-size="17" fill="#ECEFF4" text-anchor="start">• признак для дальнейшего изучения</text>
<rect x="18.0" y="273.9" width="364.0" height="104.6" rx="10" fill="#1A2129" fill-opacity="1.0" stroke="#AEB9C5" stroke-width="2"/>
<text x="32.0" y="301.9" font-size="18" fill="#AEB9C5" text-anchor="start" font-weight="700">Глина</text>
<text x="32.0" y="327.9" font-size="17" fill="#ECEFF4" text-anchor="start">• Rxo/Rt почти постоянно</text>
<text x="32.0" y="354.7" font-size="17" fill="#ECEFF4" text-anchor="start">• обычно близко к 1</text>
</g>
<text x="18.0" y="518.4" font-size="16" fill="#ECEFF4" text-anchor="start">Если отношение уходит от ПС, зона</text>
<text x="18.0" y="538.9" font-size="16" fill="#ECEFF4" text-anchor="start">помечается как возможная углеводородная</text>
<text x="18.0" y="559.4" font-size="16" fill="#ECEFF4" text-anchor="start">и передаётся на дальнейшее изучение.</text>
<text x="18.0" y="582.9" font-size="16" fill="#AEB9C5" text-anchor="start">по тексту главы, стр. 128</text>
</svg>
