<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 628" width="400" height="628" role="img" aria-label="Давление на насосах при проявлении" font-family="'Segoe UI','Noto Sans',system-ui,-apple-system,Roboto,sans-serif">
<title>Давление на насосах при проявлении</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L10 5L0 9z" fill="#4DC4BF"/></marker><marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L10 5L0 9z" fill="#ECEFF4"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#95A5A6" stroke-width="2"/></pattern><pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.3" fill="#0F1419"/><circle cx="8" cy="8" r="1.1" fill="#0F1419"/></pattern><pattern id="dash" width="14" height="8" patternUnits="userSpaceOnUse"><line x1="1" y1="4" x2="9" y2="4" stroke="#0F1419" stroke-width="1.4"/></pattern><pattern id="brick" width="24" height="14" patternUnits="userSpaceOnUse"><path d="M0 0H24M0 7H24M6 0V7M18 7V14" stroke="#0F1419" stroke-width="1.1" fill="none"/></pattern></defs>
<rect width="400" height="628" rx="10" fill="#0F1419"/>
<rect x="18.0" y="14.0" width="75.9" height="28.0" rx="14" fill="#8E44AD" fill-opacity="1.0" stroke="none" stroke-width="1.2"/>
<text x="55.9" y="33.0" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">схема</text>
<text x="18.0" y="70.0" font-size="19" fill="#ECEFF4" text-anchor="start" font-weight="700">Давление на насосах при</text>
<text x="18.0" y="95.0" font-size="19" fill="#ECEFF4" text-anchor="start" font-weight="700">проявлении</text>
<g transform="translate(0 112.0)">
<rect x="18.0" y="14.0" width="364.0" height="84.5" rx="10" fill="#1A2129" fill-opacity="1.0" stroke="#3498DB" stroke-width="2"/>
<rect x="18.0" y="14.0" width="8.0" height="84.5" rx="4" fill="#3498DB" fill-opacity="1.0" stroke="none" stroke-width="1.2"/>
<text x="42.0" y="39.0" font-size="16" fill="#3498DB" text-anchor="start" font-weight="700">Лёгкий флюид</text>
<text x="42.0" y="61.0" font-size="17" fill="#ECEFF4" text-anchor="start">Давление на насосах падает, особенно</text>
<text x="42.0" y="82.8" font-size="17" fill="#ECEFF4" text-anchor="start">при газе</text>
</g>
<text x="18.0" y="518.6" font-size="16" fill="#ECEFF4" text-anchor="start">Одно падение давления на насосах не</text>
<text x="18.0" y="539.0" font-size="16" fill="#ECEFF4" text-anchor="start">показывает силу проявления, поэтому</text>
<text x="18.0" y="559.5" font-size="16" fill="#ECEFF4" text-anchor="start">смотрят на массу газа и пластовое</text>
<text x="18.0" y="580.0" font-size="16" fill="#ECEFF4" text-anchor="start">давление.</text>
<text x="18.0" y="603.5" font-size="16" fill="#AEB9C5" text-anchor="start">по тексту главы, стр. 237–238</text>
</svg>
