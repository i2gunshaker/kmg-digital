<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 651" width="400" height="651" role="img" aria-label="Как поймать проявление по расходу на выходе" font-family="'Segoe UI','Noto Sans',system-ui,-apple-system,Roboto,sans-serif">
<title>Как поймать проявление по расходу на выходе</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L10 5L0 9z" fill="#4DC4BF"/></marker><marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L10 5L0 9z" fill="#ECEFF4"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#95A5A6" stroke-width="2"/></pattern><pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.3" fill="#0F1419"/><circle cx="8" cy="8" r="1.1" fill="#0F1419"/></pattern><pattern id="dash" width="14" height="8" patternUnits="userSpaceOnUse"><line x1="1" y1="4" x2="9" y2="4" stroke="#0F1419" stroke-width="1.4"/></pattern><pattern id="brick" width="24" height="14" patternUnits="userSpaceOnUse"><path d="M0 0H24M0 7H24M6 0V7M18 7V14" stroke="#0F1419" stroke-width="1.1" fill="none"/></pattern></defs>
<rect width="400" height="651" rx="10" fill="#0F1419"/>
<rect x="18.0" y="14.0" width="75.9" height="28.0" rx="14" fill="#8E44AD" fill-opacity="1.0" stroke="none" stroke-width="1.2"/>
<text x="55.9" y="33.0" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">схема</text>
<text x="18.0" y="70.0" font-size="19" fill="#ECEFF4" text-anchor="start" font-weight="700">Как поймать проявление по расходу</text>
<text x="18.0" y="95.0" font-size="19" fill="#ECEFF4" text-anchor="start" font-weight="700">на выходе</text>
<g transform="translate(0 112.0)">
<rect x="18.0" y="14.0" width="364.0" height="84.5" rx="10" fill="#1A2129" fill-opacity="1.0" stroke="#3498DB" stroke-width="2"/>
<rect x="18.0" y="14.0" width="8.0" height="84.5" rx="4" fill="#3498DB" fill-opacity="1.0" stroke="none" stroke-width="1.2"/>
<text x="42.0" y="39.0" font-size="16" fill="#3498DB" text-anchor="start" font-weight="700">Приток</text>
<text x="42.0" y="61.0" font-size="17" fill="#ECEFF4" text-anchor="start">Пластовый флюид ускоряет раствор</text>
<text x="42.0" y="82.8" font-size="17" fill="#ECEFF4" text-anchor="start">на выходе</text>
<line x1="200.0" y1="100.5" x2="200.0" y2="118.5" stroke="#4DC4BF" stroke-width="2.2" marker-end="url(#ar)"/>
<rect x="18.0" y="122.5" width="364.0" height="84.5" rx="10" fill="#1A2129" fill-opacity="1.0" stroke="#4DC4BF" stroke-width="2"/>
<circle cx="50.0" cy="164.8" r="17.0" fill="#4DC4BF" fill-opacity="1.0" stroke="none" stroke-width="1.2"/>
<text x="50.0" y="170.8" font-size="18" fill="#0F1419" text-anchor="middle" font-weight="700">1</text>
<text x="82.0" y="147.5" font-size="16" fill="#4DC4BF" text-anchor="start" font-weight="700">Порог</text>
<text x="82.0" y="169.5" font-size="17" fill="#ECEFF4" text-anchor="start">Расход на выходе выше на 10 %</text>
<text x="82.0" y="191.3" font-size="17" fill="#ECEFF4" text-anchor="start">и более</text>
<line x1="200.0" y1="209.0" x2="200.0" y2="227.0" stroke="#4DC4BF" stroke-width="2.2" marker-end="url(#ar)"/>
<rect x="18.0" y="231.0" width="364.0" height="84.5" rx="10" fill="#1A2129" fill-opacity="1.0" stroke="#4DC4BF" stroke-width="2"/>
<circle cx="50.0" cy="273.3" r="17.0" fill="#4DC4BF" fill-opacity="1.0" stroke="none" stroke-width="1.2"/>
<text x="50.0" y="279.3" font-size="18" fill="#0F1419" text-anchor="middle" font-weight="700">2</text>
<text x="82.0" y="256.0" font-size="16" fill="#4DC4BF" text-anchor="start" font-weight="700">Сверка</text>
<text x="82.0" y="278.0" font-size="17" fill="#ECEFF4" text-anchor="start">Сравнить расход с уровнем в</text>
<text x="82.0" y="299.8" font-size="17" fill="#ECEFF4" text-anchor="start">приёмных ёмкостях</text>
<line x1="200.0" y1="317.6" x2="200.0" y2="335.6" stroke="#4DC4BF" stroke-width="2.2" marker-end="url(#ar)"/>
<rect x="18.0" y="339.6" width="364.0" height="84.5" rx="10" fill="#1A2129" fill-opacity="1.0" stroke="#F0AD4E" stroke-width="2"/>
<rect x="18.0" y="339.6" width="8.0" height="84.5" rx="4" fill="#F0AD4E" fill-opacity="1.0" stroke="none" stroke-width="1.2"/>
<text x="42.0" y="364.6" font-size="16" fill="#F0AD4E" text-anchor="start" font-weight="700">Вывод</text>
<text x="42.0" y="386.6" font-size="17" fill="#ECEFF4" text-anchor="start">Рост расхода и уровня: начавшееся</text>
<text x="42.0" y="408.3" font-size="17" fill="#ECEFF4" text-anchor="start">проявление</text>
