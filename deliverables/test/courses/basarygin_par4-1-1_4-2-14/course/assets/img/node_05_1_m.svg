<text x="18.0" y="562.1" font-size="16" fill="#ECEFF4" text-anchor="start">Проявление считают начавшимся, когда рост</text>
<text x="18.0" y="582.6" font-size="16" fill="#ECEFF4" text-anchor="start">расхода подтверждён ростом уровня в</text>
<text x="18.0" y="603.0" font-size="16" fill="#ECEFF4" text-anchor="start">ёмкостях.</text>
<text x="18.0" y="626.5" font-size="16" fill="#AEB9C5" text-anchor="start">по тексту главы, стр. 234</text>
