<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 674" width="400" height="674" role="img" aria-label="Признаки проявлений: общий перечень" font-family="'Segoe UI','Noto Sans',system-ui,-apple-system,Roboto,sans-serif">
<title>Признаки проявлений: общий перечень</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L10 5L0 9z" fill="#4DC4BF"/></marker><marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L10 5L0 9z" fill="#ECEFF4"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#95A5A6" stroke-width="2"/></pattern><pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.3" fill="#0F1419"/><circle cx="8" cy="8" r="1.1" fill="#0F1419"/></pattern><pattern id="dash" width="14" height="8" patternUnits="userSpaceOnUse"><line x1="1" y1="4" x2="9" y2="4" stroke="#0F1419" stroke-width="1.4"/></pattern><pattern id="brick" width="24" height="14" patternUnits="userSpaceOnUse"><path d="M0 0H24M0 7H24M6 0V7M18 7V14" stroke="#0F1419" stroke-width="1.1" fill="none"/></pattern></defs>
<rect width="400" height="674" rx="10" fill="#0F1419"/>
<rect x="18.0" y="14.0" width="75.9" height="28.0" rx="14" fill="#8E44AD" fill-opacity="1.0" stroke="none" stroke-width="1.2"/>
<text x="55.9" y="33.0" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">схема</text>
<text x="18.0" y="70.0" font-size="19" fill="#ECEFF4" text-anchor="start" font-weight="700">Признаки проявлений: общий</text>
<text x="18.0" y="95.0" font-size="19" fill="#ECEFF4" text-anchor="start" font-weight="700">перечень</text>
<g transform="translate(0 112.0)">
<rect x="18.0" y="14.0" width="364.0" height="149.8" rx="10" fill="#1A2129" fill-opacity="1.0" stroke="#3498DB" stroke-width="2"/>
<rect x="18.0" y="14.0" width="8.0" height="149.8" rx="4" fill="#3498DB" fill-opacity="1.0" stroke="none" stroke-width="1.2"/>
<text x="42.0" y="39.0" font-size="16" fill="#3498DB" text-anchor="start" font-weight="700">Признаки</text>
<text x="42.0" y="61.0" font-size="17" fill="#ECEFF4" text-anchor="start">Рост объёма раствора в ёмкостях;</text>
<text x="42.0" y="82.8" font-size="17" fill="#ECEFF4" text-anchor="start">Рост расхода на выходе при</text>
<text x="42.0" y="104.5" font-size="17" fill="#ECEFF4" text-anchor="start">неизменной подаче насосов; Недолив</text>
<text x="42.0" y="126.3" font-size="17" fill="#ECEFF4" text-anchor="start">при подъёме или избыток объёма при</text>
<text x="42.0" y="148.0" font-size="17" fill="#ECEFF4" text-anchor="start">спуске</text>
<line x1="200.0" y1="165.8" x2="200.0" y2="183.8" stroke="#4DC4BF" stroke-width="2.2" marker-end="url(#ar)"/>
<rect x="18.0" y="187.8" width="364.0" height="84.5" rx="10" fill="#1A2129" fill-opacity="1.0" stroke="#F1C40F" stroke-width="2"/>
<rect x="18.0" y="187.8" width="8.0" height="84.5" rx="4" fill="#F1C40F" fill-opacity="1.0" stroke="none" stroke-width="1.2"/>
<text x="42.0" y="212.8" font-size="16" fill="#F1C40F" text-anchor="start" font-weight="700">Правило</text>
<text x="42.0" y="234.8" font-size="17" fill="#ECEFF4" text-anchor="start">Признаки по объёму, расходу или</text>
<text x="42.0" y="256.6" font-size="17" fill="#ECEFF4" text-anchor="start">доливу считать прямыми</text>
<line x1="200.0" y1="274.3" x2="200.0" y2="292.3" stroke="#4DC4BF" stroke-width="2.2" marker-end="url(#ar)"/>
<rect x="18.0" y="296.3" width="364.0" height="84.5" rx="10" fill="#1A2129" fill-opacity="1.0" stroke="#2ECC71" stroke-width="2"/>
<rect x="18.0" y="296.3" width="8.0" height="84.5" rx="4" fill="#2ECC71" fill-opacity="1.0" stroke="none" stroke-width="1.2"/>
<text x="42.0" y="321.3" font-size="16" fill="#2ECC71" text-anchor="start" font-weight="700">Вывод</text>
<text x="42.0" y="343.3" font-size="17" fill="#ECEFF4" text-anchor="start">Решение о проявлении опирается на</text>
<text x="42.0" y="365.1" font-size="17" fill="#ECEFF4" text-anchor="start">прямые признаки</text>
<line x1="200.0" y1="382.8" x2="200.0" y2="400.8" stroke="#4DC4BF" stroke-width="2.2" marker-end="url(#ar)"/>
<rect x="18.0" y="404.8" width="364.0" height="106.3" rx="10" fill="#1A2129" fill-opacity="1.0" stroke="#F0AD4E" stroke-width="2"/>
<rect x="18.0" y="404.8" width="8.0" height="106.3" rx="4" fill="#F0AD4E" fill-opacity="1.0" stroke="none" stroke-width="1.2"/>
<text x="42.0" y="429.8" font-size="16" fill="#F0AD4E" text-anchor="start" font-weight="700">Где ломается</text>
<text x="42.0" y="451.8" font-size="17" fill="#ECEFF4" text-anchor="start">Рост механической скорости без</text>
<text x="42.0" y="473.6" font-size="17" fill="#ECEFF4" text-anchor="start">притока: по тексту это возможно по</text>
<text x="42.0" y="495.4" font-size="17" fill="#ECEFF4" text-anchor="start">другим косвенным причинам</text>
