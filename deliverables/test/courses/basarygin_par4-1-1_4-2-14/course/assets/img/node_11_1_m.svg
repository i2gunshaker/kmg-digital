<text x="18.0" y="498.0" font-size="16" fill="#ECEFF4" text-anchor="start">Приток снижается постепенно из-за</text>
<text x="18.0" y="518.5" font-size="16" fill="#ECEFF4" text-anchor="start">сжимаемости жидкости в скважине и</text>
