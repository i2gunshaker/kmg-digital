<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 539" width="560" height="539" role="img" aria-label="Давление на насосах при проявлении" font-family="'Segoe UI','Noto Sans',system-ui,-apple-system,Roboto,sans-serif">
<title>Давление на насосах при проявлении</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L10 5L0 9z" fill="#4DC4BF"/></marker><marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L10 5L0 9z" fill="#ECEFF4"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#95A5A6" stroke-width="2"/></pattern><pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.3" fill="#0F1419"/><circle cx="8" cy="8" r="1.1" fill="#0F1419"/></pattern><pattern id="dash" width="14" height="8" patternUnits="userSpaceOnUse"><line x1="1" y1="4" x2="9" y2="4" stroke="#0F1419" stroke-width="1.4"/></pattern><pattern id="brick" width="24" height="14" patternUnits="userSpaceOnUse"><path d="M0 0H24M0 7H24M6 0V7M18 7V14" stroke="#0F1419" stroke-width="1.1" fill="none"/></pattern></defs>
<rect width="560" height="539" rx="10" fill="#0F1419"/>
<rect x="18.0" y="14.0" width="75.9" height="28.0" rx="14" fill="#8E44AD" fill-opacity="1.0" stroke="none" stroke-width="1.2"/>
<text x="55.9" y="33.0" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">схема</text>
<text x="18.0" y="70.0" font-size="19" fill="#ECEFF4" text-anchor="start" font-weight="700">Давление на насосах при проявлении</text>
<g transform="translate(0 87.0)">
<rect x="18.0" y="14.0" width="524.0" height="62.8" rx="10" fill="#1A2129" fill-opacity="1.0" stroke="#3498DB" stroke-width="2"/>
<rect x="18.0" y="14.0" width="8.0" height="62.8" rx="4" fill="#3498DB" fill-opacity="1.0" stroke="none" stroke-width="1.2"/>
<text x="42.0" y="39.0" font-size="16" fill="#3498DB" text-anchor="start" font-weight="700">Лёгкий флюид</text>
<text x="42.0" y="61.0" font-size="17" fill="#ECEFF4" text-anchor="start">Давление на насосах падает, особенно при газе</text>
<line x1="280.0" y1="78.8" x2="280.0" y2="96.8" stroke="#4DC4BF" stroke-width="2.2" marker-end="url(#ar)"/>
<rect x="18.0" y="100.8" width="524.0" height="62.8" rx="10" fill="#1A2129" fill-opacity="1.0" stroke="#4DC4BF" stroke-width="2"/>
<rect x="18.0" y="100.8" width="8.0" height="62.8" rx="4" fill="#4DC4BF" fill-opacity="1.0" stroke="none" stroke-width="1.2"/>
<text x="42.0" y="125.8" font-size="16" fill="#4DC4BF" text-anchor="start" font-weight="700">Большая масса газа</text>
<text x="42.0" y="147.8" font-size="17" fill="#ECEFF4" text-anchor="start">Падение может быть существенным</text>
<line x1="280.0" y1="165.5" x2="280.0" y2="183.5" stroke="#4DC4BF" stroke-width="2.2" marker-end="url(#ar)"/>
<rect x="18.0" y="187.5" width="524.0" height="62.8" rx="10" fill="#1A2129" fill-opacity="1.0" stroke="#F0AD4E" stroke-width="2"/>
<rect x="18.0" y="187.5" width="8.0" height="62.8" rx="4" fill="#F0AD4E" fill-opacity="1.0" stroke="none" stroke-width="1.2"/>
<text x="42.0" y="212.5" font-size="16" fill="#F0AD4E" text-anchor="start" font-weight="700">Высокое давление</text>
<text x="42.0" y="234.5" font-size="17" fill="#ECEFF4" text-anchor="start">Пластовое и продуктивность: в трубах может вырасти</text>
<line x1="280.0" y1="252.3" x2="280.0" y2="270.3" stroke="#4DC4BF" stroke-width="2.2" marker-end="url(#ar)"/>
<rect x="18.0" y="274.3" width="524.0" height="62.8" rx="10" fill="#1A2129" fill-opacity="1.0" stroke="#F1C40F" stroke-width="2"/>
<rect x="18.0" y="274.3" width="8.0" height="62.8" rx="4" fill="#F1C40F" fill-opacity="1.0" stroke="none" stroke-width="1.2"/>
<text x="42.0" y="299.3" font-size="16" fill="#F1C40F" text-anchor="start" font-weight="700">Вывод</text>
<text x="42.0" y="321.3" font-size="17" fill="#ECEFF4" text-anchor="start">Одно падение не говорит о силе</text>
</g>
<text x="18.0" y="450.0" font-size="16" fill="#ECEFF4" text-anchor="start">Одно падение давления на насосах не показывает силу</text>
<text x="18.0" y="470.5" font-size="16" fill="#ECEFF4" text-anchor="start">проявления, поэтому смотрят на массу газа и пластовое</text>
<text x="18.0" y="491.0" font-size="16" fill="#ECEFF4" text-anchor="start">давление.</text>
<text x="18.0" y="514.5" font-size="16" fill="#AEB9C5" text-anchor="start">по тексту главы, стр. 237–238</text>
</svg>
