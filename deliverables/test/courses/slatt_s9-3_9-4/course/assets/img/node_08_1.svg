<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 544" width="560" height="544" role="img" aria-label="Пласт A: одно тело или шесть, разделённых сланцами" font-family="'Segoe UI','Noto Sans',system-ui,-apple-system,Roboto,sans-serif">
<title>Пласт A: одно тело или шесть, разделённых сланцами</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L10 5L0 9z" fill="#4DC4BF"/></marker><marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L10 5L0 9z" fill="#ECEFF4"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#95A5A6" stroke-width="2"/></pattern><pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.3" fill="#0F1419"/><circle cx="8" cy="8" r="1.1" fill="#0F1419"/></pattern><pattern id="dash" width="14" height="8" patternUnits="userSpaceOnUse"><line x1="1" y1="4" x2="9" y2="4" stroke="#0F1419" stroke-width="1.4"/></pattern><pattern id="brick" width="24" height="14" patternUnits="userSpaceOnUse"><path d="M0 0H24M0 7H24M6 0V7M18 7V14" stroke="#0F1419" stroke-width="1.1" fill="none"/></pattern></defs>
<rect width="560" height="544" rx="10" fill="#0F1419"/>
<rect x="18.0" y="14.0" width="75.9" height="28.0" rx="14" fill="#8E44AD" fill-opacity="1.0" stroke="none" stroke-width="1.2"/>
<text x="55.9" y="33.0" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">схема</text>
<text x="105.9" y="33.0" font-size="16" fill="#AEB9C5" text-anchor="start">толщины условные, не в масштабе</text>
<text x="18.0" y="70.0" font-size="19" fill="#ECEFF4" text-anchor="start" font-weight="700">Пласт A: одно тело или шесть, разделённых</text>
<text x="18.0" y="95.0" font-size="19" fill="#ECEFF4" text-anchor="start" font-weight="700">сланцами</text>
<g transform="translate(0 112.0)">
<line x1="28.0" y1="12.0" x2="28.0" y2="332.0" stroke="#AEB9C5" stroke-width="1.6" marker-end="url(#aw)"/>
<text x="20.0" y="172.0" font-size="16" fill="#AEB9C5" text-anchor="middle" transform="rotate(-90 20.0 172.0)">глубина</text>
<rect x="46.0" y="12.0" width="496.0" height="320.0" rx="0" fill="#E8C872" fill-opacity="0.55" stroke="none" stroke-width="1.2"/>
<rect x="46.0" y="12.0" width="496.0" height="320.0" fill="url(#dots)" fill-opacity="0.35"/>
<line x1="46.0" y1="12.0" x2="542.0" y2="12.0" stroke="#0F1419" stroke-width="1.2"/>
<text x="534.0" y="178.0" font-size="16" fill="#ECEFF4" text-anchor="end" font-weight="700" stroke="#0F1419" stroke-width="4" paint-order="stroke" stroke-linejoin="round">пласт A одним телом</text>
</g>
<text x="18.0" y="476.0" font-size="16" fill="#ECEFF4" text-anchor="start">Сланцевые прослои между телами A₁–A₆ показывают, что пласт</text>
<text x="18.0" y="496.5" font-size="16" fill="#ECEFF4" text-anchor="start">A нельзя считать одним непрерывным телом.</text>
<text x="18.0" y="520.0" font-size="16" fill="#AEB9C5" text-anchor="start">по тексту главы, стр. 422</text>
</svg>
