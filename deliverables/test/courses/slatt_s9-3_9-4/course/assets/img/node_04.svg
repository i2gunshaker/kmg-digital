<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 504" width="560" height="504" role="img" aria-label="Признаки фаций речной дельты в обнажении и в скважине" font-family="'Segoe UI','Noto Sans',system-ui,-apple-system,Roboto,sans-serif">
<title>Признаки фаций речной дельты в обнажении и в скважине</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L10 5L0 9z" fill="#4DC4BF"/></marker><marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L10 5L0 9z" fill="#ECEFF4"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#95A5A6" stroke-width="2"/></pattern><pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.3" fill="#0F1419"/><circle cx="8" cy="8" r="1.1" fill="#0F1419"/></pattern><pattern id="dash" width="14" height="8" patternUnits="userSpaceOnUse"><line x1="1" y1="4" x2="9" y2="4" stroke="#0F1419" stroke-width="1.4"/></pattern><pattern id="brick" width="24" height="14" patternUnits="userSpaceOnUse"><path d="M0 0H24M0 7H24M6 0V7M18 7V14" stroke="#0F1419" stroke-width="1.1" fill="none"/></pattern></defs>
<rect width="560" height="504" rx="10" fill="#0F1419"/>
<rect x="18.0" y="14.0" width="75.9" height="28.0" rx="14" fill="#8E44AD" fill-opacity="1.0" stroke="none" stroke-width="1.2"/>
<text x="55.9" y="33.0" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">схема</text>
<text x="18.0" y="70.0" font-size="19" fill="#ECEFF4" text-anchor="start" font-weight="700">Признаки фаций речной дельты в обнажении и в</text>
<text x="18.0" y="95.0" font-size="19" fill="#ECEFF4" text-anchor="start" font-weight="700">скважине</text>
<g transform="translate(0 112.0)">
<rect x="18.0" y="12.0" width="524.0" height="34.5" rx="6" fill="#153736" fill-opacity="1.0" stroke="none" stroke-width="1.2"/>
<text x="276.5" y="34.0" font-size="16" fill="#ECEFF4" text-anchor="middle" font-weight="700">обнажение</text>
<text x="453.5" y="34.0" font-size="16" fill="#ECEFF4" text-anchor="middle" font-weight="700">скважина</text>
<rect x="18.0" y="46.5" width="524.0" height="116.4" rx="0" fill="#1A2129" fill-opacity="1.0" stroke="#2B3642" stroke-width="1.2"/>
<rect x="18.0" y="46.5" width="8.0" height="116.4" rx="0" fill="#E8C872" fill-opacity="1.0" stroke="none" stroke-width="1.2"/>
<text x="34.0" y="68.5" font-size="16" fill="#ECEFF4" text-anchor="start">основные признаки</text>
<text x="276.5" y="68.5" font-size="16" fill="#ECEFF4" text-anchor="middle">взаимоотношения</text>
<text x="276.5" y="88.5" font-size="16" fill="#ECEFF4" text-anchor="middle">фаций и огрубление</text>
<text x="276.5" y="108.5" font-size="16" fill="#ECEFF4" text-anchor="middle">зерна вверх</text>
<text x="453.5" y="68.5" font-size="16" fill="#ECEFF4" text-anchor="middle">те же признаки:</text>
<text x="453.5" y="88.5" font-size="16" fill="#ECEFF4" text-anchor="middle">огрубление вверх и</text>
<text x="453.5" y="108.5" font-size="16" fill="#ECEFF4" text-anchor="middle">взаимоотношения</text>
<text x="453.5" y="128.5" font-size="16" fill="#ECEFF4" text-anchor="middle">фаций — на керне и</text>
<text x="453.5" y="148.5" font-size="16" fill="#ECEFF4" text-anchor="middle">каротаже</text>
<rect x="18.0" y="162.9" width="524.0" height="55.0" rx="0" fill="#1A2129" fill-opacity="1.0" stroke="#2B3642" stroke-width="1.2"/>
<rect x="18.0" y="162.9" width="8.0" height="55.0" rx="0" fill="#6B8E5A" fill-opacity="1.0" stroke="none" stroke-width="1.2"/>
<text x="34.0" y="184.9" font-size="16" fill="#ECEFF4" text-anchor="start">вдали от русла</text>
<text x="276.5" y="184.9" font-size="16" fill="#ECEFF4" text-anchor="middle">не указано</text>
<text x="453.5" y="184.9" font-size="16" fill="#ECEFF4" text-anchor="middle">боковое утоньшение</text>
<text x="453.5" y="204.9" font-size="16" fill="#ECEFF4" text-anchor="middle">и уменьшение зерна</text>
<rect x="18.0" y="217.8" width="524.0" height="55.0" rx="0" fill="#1A2129" fill-opacity="1.0" stroke="#2B3642" stroke-width="1.2"/>
<rect x="18.0" y="217.8" width="8.0" height="55.0" rx="0" fill="#E8C872" fill-opacity="1.0" stroke="none" stroke-width="1.2"/>
<text x="34.0" y="239.8" font-size="16" fill="#ECEFF4" text-anchor="start">осадочные</text>
<text x="34.0" y="260.3" font-size="16" fill="#ECEFF4" text-anchor="start">структуры</text>
<text x="276.5" y="239.8" font-size="16" fill="#ECEFF4" text-anchor="middle">характерный набор</text>
<text x="276.5" y="259.8" font-size="16" fill="#ECEFF4" text-anchor="middle">структур</text>
<text x="453.5" y="239.8" font-size="16" fill="#ECEFF4" text-anchor="middle">дополнительный</text>
<text x="453.5" y="259.8" font-size="16" fill="#ECEFF4" text-anchor="middle">признак</text>
</g>
<text x="18.0" y="414.8" font-size="16" fill="#ECEFF4" text-anchor="start">Огрубление вверх и взаимоотношения фаций видны и на керне, и</text>
<text x="18.0" y="435.3" font-size="16" fill="#ECEFF4" text-anchor="start">на каротаже, а вдали от русла каротаж показывает боковое</text>
<text x="18.0" y="455.8" font-size="16" fill="#ECEFF4" text-anchor="start">утоньшение и уменьшение зерна.</text>
<text x="18.0" y="479.2" font-size="16" fill="#AEB9C5" text-anchor="start">по тексту главы, стр. 411, 413</text>
</svg>
