<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 573" width="400" height="573" role="img" aria-label="Признаки фаций речной дельты в обнажении и в скважине" font-family="'Segoe UI','Noto Sans',system-ui,-apple-system,Roboto,sans-serif">
<title>Признаки фаций речной дельты в обнажении и в скважине</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L10 5L0 9z" fill="#4DC4BF"/></marker><marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L10 5L0 9z" fill="#ECEFF4"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#95A5A6" stroke-width="2"/></pattern><pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.3" fill="#0F1419"/><circle cx="8" cy="8" r="1.1" fill="#0F1419"/></pattern><pattern id="dash" width="14" height="8" patternUnits="userSpaceOnUse"><line x1="1" y1="4" x2="9" y2="4" stroke="#0F1419" stroke-width="1.4"/></pattern><pattern id="brick" width="24" height="14" patternUnits="userSpaceOnUse"><path d="M0 0H24M0 7H24M6 0V7M18 7V14" stroke="#0F1419" stroke-width="1.1" fill="none"/></pattern></defs>
<rect width="400" height="573" rx="10" fill="#0F1419"/>
<rect x="18.0" y="14.0" width="75.9" height="28.0" rx="14" fill="#8E44AD" fill-opacity="1.0" stroke="none" stroke-width="1.2"/>
<text x="55.9" y="33.0" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">схема</text>
<text x="18.0" y="70.0" font-size="19" fill="#ECEFF4" text-anchor="start" font-weight="700">Признаки фаций речной дельты в</text>
<text x="18.0" y="95.0" font-size="19" fill="#ECEFF4" text-anchor="start" font-weight="700">обнажении и в скважине</text>
<g transform="translate(0 112.0)">
<rect x="18.0" y="12.0" width="364.0" height="138.9" rx="6" fill="#1A2129" fill-opacity="1.0" stroke="#2B3642" stroke-width="1.2"/>
<rect x="18.0" y="12.0" width="8.0" height="138.9" rx="0" fill="#E8C872" fill-opacity="1.0" stroke="none" stroke-width="1.2"/>
<text x="36.0" y="35.0" font-size="16" fill="#ECEFF4" text-anchor="start" font-weight="700">основные признаки</text>
<text x="36.0" y="55.5" font-size="16" fill="#ECEFF4" text-anchor="start">обнажение взаимоотношения фаций и</text>
<text x="36.0" y="76.0" font-size="16" fill="#ECEFF4" text-anchor="start">огрубление зерна вверх · скважина те же</text>
<text x="36.0" y="96.4" font-size="16" fill="#ECEFF4" text-anchor="start">признаки: огрубление вверх и</text>
<text x="36.0" y="116.9" font-size="16" fill="#ECEFF4" text-anchor="start">взаимоотношения фаций — на керне и</text>
<text x="36.0" y="137.4" font-size="16" fill="#ECEFF4" text-anchor="start">каротаже</text>
<rect x="18.0" y="158.9" width="364.0" height="77.4" rx="6" fill="#1A2129" fill-opacity="1.0" stroke="#2B3642" stroke-width="1.2"/>
<rect x="18.0" y="158.9" width="8.0" height="77.4" rx="0" fill="#6B8E5A" fill-opacity="1.0" stroke="none" stroke-width="1.2"/>
<text x="36.0" y="181.9" font-size="16" fill="#ECEFF4" text-anchor="start" font-weight="700">вдали от русла</text>
<text x="36.0" y="202.4" font-size="16" fill="#ECEFF4" text-anchor="start">обнажение не указано · скважина боковое</text>
<text x="36.0" y="222.8" font-size="16" fill="#ECEFF4" text-anchor="start">утоньшение и уменьшение зерна</text>
<rect x="18.0" y="244.3" width="364.0" height="77.4" rx="6" fill="#1A2129" fill-opacity="1.0" stroke="#2B3642" stroke-width="1.2"/>
<rect x="18.0" y="244.3" width="8.0" height="77.4" rx="0" fill="#E8C872" fill-opacity="1.0" stroke="none" stroke-width="1.2"/>
<text x="36.0" y="267.3" font-size="16" fill="#ECEFF4" text-anchor="start" font-weight="700">осадочные структуры</text>
<text x="36.0" y="287.8" font-size="16" fill="#ECEFF4" text-anchor="start">обнажение характерный набор структур ·</text>
<text x="36.0" y="308.3" font-size="16" fill="#ECEFF4" text-anchor="start">скважина дополнительный признак</text>
</g>
<text x="18.0" y="463.8" font-size="16" fill="#ECEFF4" text-anchor="start">Огрубление вверх и взаимоотношения фаций</text>
<text x="18.0" y="484.2" font-size="16" fill="#ECEFF4" text-anchor="start">видны и на керне, и на каротаже, а вдали от</text>
<text x="18.0" y="504.7" font-size="16" fill="#ECEFF4" text-anchor="start">русла каротаж показывает боковое</text>
<text x="18.0" y="525.2" font-size="16" fill="#ECEFF4" text-anchor="start">утоньшение и уменьшение зерна.</text>
<text x="18.0" y="548.7" font-size="16" fill="#AEB9C5" text-anchor="start">по тексту главы, стр. 411, 413</text>
</svg>
