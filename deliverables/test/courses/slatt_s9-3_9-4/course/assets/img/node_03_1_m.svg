<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 553" width="400" height="553" role="img" aria-label="Наступание дельты: устьевой бар ложится на илы продельты" font-family="'Segoe UI','Noto Sans',system-ui,-apple-system,Roboto,sans-serif">
