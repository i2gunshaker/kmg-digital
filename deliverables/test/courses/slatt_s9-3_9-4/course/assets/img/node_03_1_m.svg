<text x="114.5" y="109.0" font-size="16" fill="#ECEFF4" text-anchor="middle" font-weight="700" stroke="#0F1419" stroke-width="4" paint-order="stroke" stroke-linejoin="round">крупный песок</text>
<text x="114.5" y="129.0" font-size="16" fill="#ECEFF4" text-anchor="middle" font-weight="700" stroke="#0F1419" stroke-width="4" paint-order="stroke" stroke-linejoin="round">устьевого бара</text>
<text x="104.0" y="65.5" font-size="16" fill="#ECEFF4" text-anchor="middle" stroke="#0F1419" stroke-width="4" paint-order="stroke" stroke-linejoin="round">уровень моря</text>
<text x="190.5" y="49.0" font-size="16" fill="#ECEFF4" text-anchor="middle" stroke="#0F1419" stroke-width="4" paint-order="stroke" stroke-linejoin="round">дельта наступает</text>
