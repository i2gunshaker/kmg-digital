<text x="18.0" y="464.0" font-size="16" fill="#ECEFF4" text-anchor="start">Линии времени — прежние положения фронта</text>
<text x="18.0" y="484.5" font-size="16" fill="#ECEFF4" text-anchor="start">дельты: они пересекают границы песка и</text>
<text x="18.0" y="505.0" font-size="16" fill="#ECEFF4" text-anchor="start">ила.</text>
<text x="18.0" y="528.4" font-size="16" fill="#AEB9C5" text-anchor="start">по тексту главы, стр. 411, 413, 415</text>
