<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 538" width="400" height="538" role="img" aria-label="Два способа корреляции интервала Romeo" font-family="'Segoe UI','Noto Sans',system-ui,-apple-system,Roboto,sans-serif">
<title>Два способа корреляции интервала Romeo</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L10 5L0 9z" fill="#4DC4BF"/></marker><marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L10 5L0 9z" fill="#ECEFF4"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#95A5A6" stroke-width="2"/></pattern><pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.3" fill="#0F1419"/><circle cx="8" cy="8" r="1.1" fill="#0F1419"/></pattern><pattern id="dash" width="14" height="8" patternUnits="userSpaceOnUse"><line x1="1" y1="4" x2="9" y2="4" stroke="#0F1419" stroke-width="1.4"/></pattern><pattern id="brick" width="24" height="14" patternUnits="userSpaceOnUse"><path d="M0 0H24M0 7H24M6 0V7M18 7V14" stroke="#0F1419" stroke-width="1.1" fill="none"/></pattern></defs>
<rect width="400" height="538" rx="10" fill="#0F1419"/>
<rect x="18.0" y="14.0" width="75.9" height="28.0" rx="14" fill="#8E44AD" fill-opacity="1.0" stroke="none" stroke-width="1.2"/>
<text x="55.9" y="33.0" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">схема</text>
<text x="18.0" y="70.0" font-size="19" fill="#ECEFF4" text-anchor="start" font-weight="700">Два способа корреляции интервала</text>
<text x="18.0" y="95.0" font-size="19" fill="#ECEFF4" text-anchor="start" font-weight="700">Romeo</text>
<g transform="translate(0 112.0)">
<rect x="18.0" y="14.0" width="364.0" height="131.3" rx="10" fill="#1A2129" fill-opacity="1.0" stroke="#AEB9C5" stroke-width="2"/>
<text x="32.0" y="42.0" font-size="18" fill="#AEB9C5" text-anchor="start" font-weight="700">Литостратиграфия</text>
<text x="32.0" y="68.0" font-size="17" fill="#ECEFF4" text-anchor="start">• сопоставление по литологии</text>
<text x="32.0" y="94.8" font-size="17" fill="#ECEFF4" text-anchor="start">• расходится с историей добычи</text>
<text x="32.0" y="121.6" font-size="17" fill="#ECEFF4" text-anchor="start">• падение песчаников не видно</text>
</g>
<text x="18.0" y="428.6" font-size="16" fill="#ECEFF4" text-anchor="start">Хроностратиграфическая схема лучше</text>
<text x="18.0" y="449.1" font-size="16" fill="#ECEFF4" text-anchor="start">совпала с историей добычи, потому что</text>
<text x="18.0" y="469.6" font-size="16" fill="#ECEFF4" text-anchor="start">пласты падают полого и фации меняются</text>
<text x="18.0" y="490.1" font-size="16" fill="#ECEFF4" text-anchor="start">быстро.</text>
<text x="18.0" y="513.6" font-size="16" fill="#AEB9C5" text-anchor="start">по тексту главы, стр. 417</text>
</svg>
