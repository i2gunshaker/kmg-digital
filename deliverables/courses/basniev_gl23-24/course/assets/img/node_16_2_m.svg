<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 446" width="400" height="446" role="img" aria-label="Погрешность формулы для скважины конечного радиуса" font-family="'Segoe UI','Noto Sans',system-ui,-apple-system,Roboto,sans-serif">
<title>Погрешность формулы для скважины конечного радиуса</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L10 5L0 9z" fill="#4DC4BF"/></marker><marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L10 5L0 9z" fill="#ECEFF4"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#95A5A6" stroke-width="2"/></pattern><pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.3" fill="#0F1419"/><circle cx="8" cy="8" r="1.1" fill="#0F1419"/></pattern><pattern id="dash" width="14" height="8" patternUnits="userSpaceOnUse"><line x1="1" y1="4" x2="9" y2="4" stroke="#0F1419" stroke-width="1.4"/></pattern><pattern id="brick" width="24" height="14" patternUnits="userSpaceOnUse"><path d="M0 0H24M0 7H24M6 0V7M18 7V14" stroke="#0F1419" stroke-width="1.1" fill="none"/></pattern></defs>
<rect width="400" height="446" rx="10" fill="#0F1419"/>
<rect x="18.0" y="14.0" width="75.9" height="28.0" rx="14" fill="#8E44AD" fill-opacity="1.0" stroke="none" stroke-width="1.2"/>
<text x="55.9" y="33.0" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">схема</text>
<text x="18.0" y="70.0" font-size="19" fill="#ECEFF4" text-anchor="start" font-weight="700">Погрешность формулы для</text>
<text x="18.0" y="95.0" font-size="19" fill="#ECEFF4" text-anchor="start" font-weight="700">скважины конечного радиуса</text>
<g transform="translate(0 112.0)">
<text x="18.0" y="28.0" font-size="17" fill="#ECEFF4" text-anchor="start">f₀ = 10</text>
<rect x="18.0" y="39.8" width="364.0" height="24.0" rx="6" fill="#1A2129" fill-opacity="1.0" stroke="none" stroke-width="1.2"/>
<rect x="18.0" y="39.8" width="303.3" height="24.0" rx="6" fill="#4DC4BF" fill-opacity="1.0" stroke="none" stroke-width="1.2"/>
<text x="382.0" y="30.8" font-size="17" fill="#4DC4BF" text-anchor="end" font-weight="700">5 %</text>
<line x1="18.0" y1="67.8" x2="18.0" y2="73.8" stroke="#AEB9C5" stroke-width="1.4"/>
<text x="26.0" y="90.8" font-size="16" fill="#AEB9C5" text-anchor="middle">0</text>
<line x1="139.3" y1="67.8" x2="139.3" y2="73.8" stroke="#AEB9C5" stroke-width="1.4"/>
<text x="139.3" y="90.8" font-size="16" fill="#AEB9C5" text-anchor="middle">2</text>
<line x1="260.7" y1="67.8" x2="260.7" y2="73.8" stroke="#AEB9C5" stroke-width="1.4"/>
<text x="260.7" y="90.8" font-size="16" fill="#AEB9C5" text-anchor="middle">4</text>
<line x1="382.0" y1="67.8" x2="382.0" y2="73.8" stroke="#AEB9C5" stroke-width="1.4"/>
<text x="368.0" y="90.8" font-size="16" fill="#AEB9C5" text-anchor="middle">6</text>
<text x="200.0" y="111.8" font-size="16" fill="#AEB9C5" text-anchor="middle">погрешность, %</text>
</g>
<text x="18.0" y="377.3" font-size="16" fill="#ECEFF4" text-anchor="start">Чем больше f₀ = κt/rc², то есть чем позже,</text>
<text x="18.0" y="397.8" font-size="16" fill="#ECEFF4" text-anchor="start">тем точнее формула точечного стока.</text>
<text x="18.0" y="421.2" font-size="16" fill="#AEB9C5" text-anchor="start">числа из текста главы, стр. 492–493</text>
