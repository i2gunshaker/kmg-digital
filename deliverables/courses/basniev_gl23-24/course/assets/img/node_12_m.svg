<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 462" width="400" height="462" role="img" aria-label="От пяти параметров к одной переменной" font-family="'Segoe UI','Noto Sans',system-ui,-apple-system,Roboto,sans-serif">
<title>От пяти параметров к одной переменной</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L10 5L0 9z" fill="#4DC4BF"/></marker><marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L10 5L0 9z" fill="#ECEFF4"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#95A5A6" stroke-width="2"/></pattern><pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.3" fill="#0F1419"/><circle cx="8" cy="8" r="1.1" fill="#0F1419"/></pattern><pattern id="dash" width="14" height="8" patternUnits="userSpaceOnUse"><line x1="1" y1="4" x2="9" y2="4" stroke="#0F1419" stroke-width="1.4"/></pattern><pattern id="brick" width="24" height="14" patternUnits="userSpaceOnUse"><path d="M0 0H24M0 7H24M6 0V7M18 7V14" stroke="#0F1419" stroke-width="1.1" fill="none"/></pattern></defs>
<rect width="400" height="462" rx="10" fill="#0F1419"/>
<rect x="18.0" y="14.0" width="75.9" height="28.0" rx="14" fill="#8E44AD" fill-opacity="1.0" stroke="none" stroke-width="1.2"/>
<text x="55.9" y="33.0" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">схема</text>
<text x="18.0" y="70.0" font-size="19" fill="#ECEFF4" text-anchor="start" font-weight="700">От пяти параметров к одной</text>
<text x="18.0" y="95.0" font-size="19" fill="#ECEFF4" text-anchor="start" font-weight="700">переменной</text>
<g transform="translate(0 112.0)">
<rect x="18.0" y="12.0" width="364.0" height="41.0" rx="10" fill="#153736" fill-opacity="1.0" stroke="#4DC4BF" stroke-width="2"/>
<text x="32.0" y="39.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Параметры: r, t, κ, pк и Q₀μ/(2πkh)</text>
<rect x="64.0" y="67.0" width="318.0" height="82.0" rx="10" fill="#1A2129" fill-opacity="1.0" stroke="#9BD7F5" stroke-width="2"/>
<line x1="36.0" y1="108.0" x2="62.0" y2="108.0" stroke="#4DC4BF" stroke-width="2.2" marker-end="url(#ar)"/>
<text x="78.0" y="92.0" font-size="17" fill="#9BD7F5" text-anchor="start" font-weight="700">Независимые размерности</text>
<text x="78.0" y="113.8" font-size="17" fill="#9BD7F5" text-anchor="start" font-weight="700">имеют три</text>
<text x="78.0" y="135.6" font-size="16" fill="#ECEFF4" text-anchor="start">r, t, pк</text>
<rect x="64.0" y="163.0" width="318.0" height="60.2" rx="10" fill="#1A2129" fill-opacity="1.0" stroke="#4DC4BF" stroke-width="2"/>
<line x1="36.0" y1="193.2" x2="62.0" y2="193.2" stroke="#4DC4BF" stroke-width="2.2" marker-end="url(#ar)"/>
<text x="78.0" y="188.0" font-size="17" fill="#4DC4BF" text-anchor="start" font-weight="700">Автомодельная переменная</text>
<text x="78.0" y="209.8" font-size="16" fill="#ECEFF4" text-anchor="start">ξ = r/(2√(κt))</text>
<rect x="64.0" y="237.3" width="318.0" height="60.2" rx="10" fill="#1A2129" fill-opacity="1.0" stroke="#F1C40F" stroke-width="2"/>
<line x1="36.0" y1="267.4" x2="62.0" y2="267.4" stroke="#4DC4BF" stroke-width="2.2" marker-end="url(#ar)"/>
<text x="78.0" y="262.3" font-size="17" fill="#F1C40F" text-anchor="start" font-weight="700">Безразмерный параметр</text>
<text x="78.0" y="284.0" font-size="16" fill="#ECEFF4" text-anchor="start">Q₀μ/(2πkh·pк)</text>
<line x1="36.0" y1="53.0" x2="36.0" y2="267.4" stroke="#4DC4BF" stroke-width="2.2"/>
</g>
<text x="18.0" y="437.5" font-size="16" fill="#AEB9C5" text-anchor="start">по тексту главы, стр. 488–489</text>
</svg>
