<rect width="400" height="464" rx="10" fill="#0F1419"/>
<rect x="18.0" y="14.0" width="75.9" height="28.0" rx="14" fill="#8E44AD" fill-opacity="1.0" stroke="none" stroke-width="1.2"/>
<text x="55.9" y="33.0" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">схема</text>
<text x="18.0" y="70.0" font-size="19" fill="#ECEFF4" text-anchor="start" font-weight="700">Ясный разрез и смешанный разрез:</text>
<text x="18.0" y="95.0" font-size="19" fill="#ECEFF4" text-anchor="start" font-weight="700">разный подход к оценке</text>
<g transform="translate(0 112.0)">
<rect x="18.0" y="14.0" width="364.0" height="104.6" rx="10" fill="#1A2129" fill-opacity="1.0" stroke="#2ECC71" stroke-width="2"/>
<text x="32.0" y="42.0" font-size="18" fill="#2ECC71" text-anchor="start" font-weight="700">Ясные признаки</text>
<text x="32.0" y="68.0" font-size="17" fill="#ECEFF4" text-anchor="start">• один тип пород</text>
<text x="32.0" y="94.8" font-size="17" fill="#ECEFF4" text-anchor="start">• малое число методов</text>
<rect x="18.0" y="130.6" width="364.0" height="104.6" rx="10" fill="#1A2129" fill-opacity="1.0" stroke="#F0AD4E" stroke-width="2"/>
<text x="32.0" y="158.6" font-size="18" fill="#F0AD4E" text-anchor="start" font-weight="700">Смешанный разрез</text>
<text x="32.0" y="184.6" font-size="17" fill="#ECEFF4" text-anchor="start">• терригенные и карбонатные</text>
<text x="32.0" y="211.4" font-size="17" fill="#ECEFF4" text-anchor="start">• количественная оценка с геологией</text>
