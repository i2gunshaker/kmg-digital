<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 464" width="400" height="464" role="img" aria-label="Ясный разрез и смешанный разрез: разный подход к оценке" font-family="'Segoe UI','Noto Sans',system-ui,-apple-system,Roboto,sans-serif">
<title>Ясный разрез и смешанный разрез: разный подход к оценке</title>
