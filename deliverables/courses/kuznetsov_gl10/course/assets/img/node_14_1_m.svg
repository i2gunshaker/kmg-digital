<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 641" width="400" height="641" role="img" aria-label="Что кроме рельефа создаёт объём ловушки" font-family="'Segoe UI','Noto Sans',system-ui,-apple-system,Roboto,sans-serif">
<title>Что кроме рельефа создаёт объём ловушки</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L10 5L0 9z" fill="#4DC4BF"/></marker><marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L10 5L0 9z" fill="#ECEFF4"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#95A5A6" stroke-width="2"/></pattern><pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.3" fill="#0F1419"/><circle cx="8" cy="8" r="1.1" fill="#0F1419"/></pattern><pattern id="dash" width="14" height="8" patternUnits="userSpaceOnUse"><line x1="1" y1="4" x2="9" y2="4" stroke="#0F1419" stroke-width="1.4"/></pattern><pattern id="brick" width="24" height="14" patternUnits="userSpaceOnUse"><path d="M0 0H24M0 7H24M6 0V7M18 7V14" stroke="#0F1419" stroke-width="1.1" fill="none"/></pattern></defs>
<rect width="400" height="641" rx="10" fill="#0F1419"/>
<rect x="18.0" y="14.0" width="75.9" height="28.0" rx="14" fill="#8E44AD" fill-opacity="1.0" stroke="none" stroke-width="1.2"/>
<text x="55.9" y="33.0" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">схема</text>
<text x="18.0" y="70.0" font-size="19" fill="#ECEFF4" text-anchor="start" font-weight="700">Что кроме рельефа создаёт объём</text>
<text x="18.0" y="95.0" font-size="19" fill="#ECEFF4" text-anchor="start" font-weight="700">ловушки</text>
<g transform="translate(0 112.0)">
<rect x="18.0" y="12.0" width="364.0" height="41.0" rx="10" fill="#153736" fill-opacity="1.0" stroke="#4DC4BF" stroke-width="2"/>
<text x="32.0" y="39.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Рифовые ловушки</text>
<rect x="64.0" y="67.0" width="318.0" height="80.7" rx="10" fill="#1A2129" fill-opacity="1.0" stroke="#F0A35E" stroke-width="2"/>
<line x1="36.0" y1="107.4" x2="62.0" y2="107.4" stroke="#4DC4BF" stroke-width="2.2" marker-end="url(#ar)"/>
<text x="78.0" y="92.0" font-size="17" fill="#F0A35E" text-anchor="start" font-weight="700">Палеогеоморфологические</text>
<text x="78.0" y="113.8" font-size="16" fill="#ECEFF4" text-anchor="start">объём задаёт рельеф рифа под</text>
<text x="78.0" y="134.3" font-size="16" fill="#ECEFF4" text-anchor="start">покрышкой</text>
<rect x="64.0" y="161.8" width="318.0" height="102.5" rx="10" fill="#1A2129" fill-opacity="1.0" stroke="#8C7B6B" stroke-width="2"/>
<line x1="36.0" y1="213.0" x2="62.0" y2="213.0" stroke="#4DC4BF" stroke-width="2.2" marker-end="url(#ar)"/>
<text x="78.0" y="186.8" font-size="17" fill="#A6998D" text-anchor="start" font-weight="700">Литолого-</text>
<text x="78.0" y="208.5" font-size="17" fill="#A6998D" text-anchor="start" font-weight="700">палеогеоморфологические</text>
<text x="78.0" y="230.3" font-size="16" fill="#ECEFF4" text-anchor="start">плотные внерифовые породы</text>
<text x="78.0" y="250.8" font-size="16" fill="#ECEFF4" text-anchor="start">добавляют высоту</text>
<rect x="64.0" y="278.2" width="318.0" height="102.5" rx="10" fill="#1A2129" fill-opacity="1.0" stroke="#4DC4BF" stroke-width="2"/>
<line x1="36.0" y1="329.5" x2="62.0" y2="329.5" stroke="#4DC4BF" stroke-width="2.2" marker-end="url(#ar)"/>
<text x="78.0" y="303.2" font-size="17" fill="#4DC4BF" text-anchor="start" font-weight="700">Структурно-</text>
<text x="78.0" y="325.0" font-size="17" fill="#4DC4BF" text-anchor="start" font-weight="700">палеогеоморфологические</text>
<text x="78.0" y="346.8" font-size="16" fill="#ECEFF4" text-anchor="start">на готовый риф наложились</text>
<text x="78.0" y="367.2" font-size="16" fill="#ECEFF4" text-anchor="start">тектонические движения</text>
<rect x="64.0" y="394.7" width="318.0" height="82.0" rx="10" fill="#1A2129" fill-opacity="1.0" stroke="#A98FD1" stroke-width="2"/>
<line x1="36.0" y1="435.7" x2="62.0" y2="435.7" stroke="#4DC4BF" stroke-width="2.2" marker-end="url(#ar)"/>
<text x="78.0" y="419.7" font-size="17" fill="#A98FD1" text-anchor="start" font-weight="700">Структурные с рифовым</text>
<text x="78.0" y="441.5" font-size="17" fill="#A98FD1" text-anchor="start" font-weight="700">резервуаром</text>
<text x="78.0" y="463.2" font-size="16" fill="#ECEFF4" text-anchor="start">ведущий фактор тектонический</text>
<line x1="36.0" y1="53.0" x2="36.0" y2="435.7" stroke="#4DC4BF" stroke-width="2.2"/>
