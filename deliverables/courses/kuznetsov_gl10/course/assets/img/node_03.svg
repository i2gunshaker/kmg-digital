<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 381" width="560" height="381" role="img" aria-label="Из чего сложен крупный рифовый комплекс" font-family="'Segoe UI','Noto Sans',system-ui,-apple-system,Roboto,sans-serif">
<title>Из чего сложен крупный рифовый комплекс</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L10 5L0 9z" fill="#4DC4BF"/></marker><marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L10 5L0 9z" fill="#ECEFF4"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#95A5A6" stroke-width="2"/></pattern><pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.3" fill="#0F1419"/><circle cx="8" cy="8" r="1.1" fill="#0F1419"/></pattern><pattern id="dash" width="14" height="8" patternUnits="userSpaceOnUse"><line x1="1" y1="4" x2="9" y2="4" stroke="#0F1419" stroke-width="1.4"/></pattern><pattern id="brick" width="24" height="14" patternUnits="userSpaceOnUse"><path d="M0 0H24M0 7H24M6 0V7M18 7V14" stroke="#0F1419" stroke-width="1.1" fill="none"/></pattern></defs>
<rect width="560" height="381" rx="10" fill="#0F1419"/>
<rect x="18.0" y="14.0" width="75.9" height="28.0" rx="14" fill="#8E44AD" fill-opacity="1.0" stroke="none" stroke-width="1.2"/>
<text x="55.9" y="33.0" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">схема</text>
<text x="18.0" y="70.0" font-size="19" fill="#ECEFF4" text-anchor="start" font-weight="700">Из чего сложен крупный рифовый комплекс</text>
<g transform="translate(0 87.0)">
<text x="18.0" y="28.0" font-size="17" fill="#ECEFF4" text-anchor="start">Биогермные известняки</text>
<rect x="18.0" y="39.8" width="524.0" height="24.0" rx="6" fill="#1A2129" fill-opacity="1.0" stroke="none" stroke-width="1.2"/>
<rect x="18.0" y="39.8" width="104.8" height="24.0" rx="6" fill="#F0A35E" fill-opacity="1.0" stroke="none" stroke-width="1.2"/>
<text x="542.0" y="30.8" font-size="17" fill="#F0A35E" text-anchor="end" font-weight="700">не более 10–20 %</text>
<text x="18.0" y="89.8" font-size="17" fill="#ECEFF4" text-anchor="start">Обломочные</text>
<text x="18.0" y="111.5" font-size="17" fill="#ECEFF4" text-anchor="start">известняки</text>
<rect x="18.0" y="123.3" width="524.0" height="24.0" rx="6" fill="#1A2129" fill-opacity="1.0" stroke="none" stroke-width="1.2"/>
<rect x="280.0" y="123.3" width="157.2" height="24.0" rx="6" fill="#7FB3D5" fill-opacity="1.0" stroke="none" stroke-width="1.2"/>
<text x="542.0" y="114.3" font-size="17" fill="#7FB3D5" text-anchor="end" font-weight="700">часто больше 50, нередко 60–80 %</text>
<line x1="18.0" y1="151.3" x2="18.0" y2="157.3" stroke="#AEB9C5" stroke-width="1.4"/>
<text x="26.0" y="174.3" font-size="16" fill="#AEB9C5" text-anchor="middle">0</text>
<line x1="122.8" y1="151.3" x2="122.8" y2="157.3" stroke="#AEB9C5" stroke-width="1.4"/>
<text x="122.8" y="174.3" font-size="16" fill="#AEB9C5" text-anchor="middle">20</text>
<line x1="227.6" y1="151.3" x2="227.6" y2="157.3" stroke="#AEB9C5" stroke-width="1.4"/>
<text x="227.6" y="174.3" font-size="16" fill="#AEB9C5" text-anchor="middle">40</text>
<line x1="332.4" y1="151.3" x2="332.4" y2="157.3" stroke="#AEB9C5" stroke-width="1.4"/>
<text x="332.4" y="174.3" font-size="16" fill="#AEB9C5" text-anchor="middle">60</text>
<line x1="437.2" y1="151.3" x2="437.2" y2="157.3" stroke="#AEB9C5" stroke-width="1.4"/>
<text x="437.2" y="174.3" font-size="16" fill="#AEB9C5" text-anchor="middle">80</text>
<line x1="542.0" y1="151.3" x2="542.0" y2="157.3" stroke="#AEB9C5" stroke-width="1.4"/>
<text x="528.0" y="174.3" font-size="16" fill="#AEB9C5" text-anchor="middle">100</text>
<text x="280.0" y="195.3" font-size="16" fill="#AEB9C5" text-anchor="middle">доля пород, %</text>
</g>
<text x="18.0" y="312.3" font-size="16" fill="#ECEFF4" text-anchor="start">Каркас рифа — биогермные известняки, но по объёму обычно</text>
<text x="18.0" y="332.8" font-size="16" fill="#ECEFF4" text-anchor="start">преобладают обломочные.</text>
<text x="18.0" y="356.2" font-size="16" fill="#AEB9C5" text-anchor="start">числа из текста главы, стр. 202–203</text>
</svg>
