<polygon points="200.0,214.0 207.1,133.6 200.0,93.4 257.0,125.6 363.8,139.0 363.8,214.0" fill="#7FB3D5" fill-opacity="0.85" stroke="#0F1419" stroke-width="1.2" stroke-linejoin="round"/>
