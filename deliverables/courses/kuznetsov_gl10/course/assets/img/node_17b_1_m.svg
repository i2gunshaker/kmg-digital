<rect width="400" height="540" rx="10" fill="#0F1419"/>
<rect x="18.0" y="14.0" width="75.9" height="28.0" rx="14" fill="#8E44AD" fill-opacity="1.0" stroke="none" stroke-width="1.2"/>
<text x="55.9" y="33.0" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">схема</text>
<text x="105.9" y="33.0" font-size="16" fill="#AEB9C5" text-anchor="start">вертикаль преувеличена, не в</text>
<text x="105.9" y="52.0" font-size="16" fill="#AEB9C5" text-anchor="start">масштабе</text>
<text x="18.0" y="84.0" font-size="19" fill="#ECEFF4" text-anchor="start" font-weight="700">Рифовая система: первые</text>
<text x="18.0" y="109.0" font-size="19" fill="#ECEFF4" text-anchor="start" font-weight="700">скважины и критическое</text>
<text x="18.0" y="134.0" font-size="19" fill="#ECEFF4" text-anchor="start" font-weight="700">направление</text>
<g transform="translate(0 151.0)">
