<text x="265.3" y="161.3" font-size="16" fill="#ECEFF4" text-anchor="middle" font-weight="700" stroke="#0F1419" stroke-width="4" paint-order="stroke" stroke-linejoin="round">тыльная зона</text>
<line x1="171.5" y1="28.0" x2="171.5" y2="207.3" stroke="#ECEFF4" stroke-width="4"/>
<text x="171.5" y="20.0" font-size="16" fill="#ECEFF4" text-anchor="middle" font-weight="700" stroke="#0F1419" stroke-width="4" paint-order="stroke" stroke-linejoin="round">1</text>
<text x="22.0" y="270.0" font-size="16" fill="#AEB9C5" text-anchor="start">к бассейну</text>
<text x="378.0" y="270.0" font-size="16" fill="#AEB9C5" text-anchor="end">к шельфу</text>
