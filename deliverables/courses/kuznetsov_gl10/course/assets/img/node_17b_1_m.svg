<text x="18.0" y="451.0" font-size="16" fill="#ECEFF4" text-anchor="start">В тыльной зоне, как правило, лежит</text>
<text x="18.0" y="471.5" font-size="16" fill="#ECEFF4" text-anchor="start">критическое направление ловушки: от него</text>
<text x="18.0" y="492.0" font-size="16" fill="#ECEFF4" text-anchor="start">зависит высота залежи.</text>
<text x="18.0" y="515.4" font-size="16" fill="#AEB9C5" text-anchor="start">по тексту главы, стр. 214–222</text>
