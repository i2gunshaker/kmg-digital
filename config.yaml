# Входные материалы организаторов (в git не кладём). Переопределяется переменной KURS_INPUT_DIR.
input_dir: ~/Downloads/хакатон-2
schemas_dir: пакет_вводных/01_схемы
domain_pack: domain/geology   # смежный домен: KURS_DOMAIN_PACK=drilling или kurs run --domain drilling

llm:
  # backend: auto | anthropic | openai ; переопределяется KURS_LLM_BACKEND / KURS_LLM_MODEL
  # auto: есть ANTHROPIC_API_KEY — anthropic, иначе OPENAI_API_KEY — openai (OPENAI_BASE_URL — совместимый сервер)
  backend: auto
  # общий предел расхода за всё время по build/llm_usage.jsonl, $. Предел на запуск задаёт --max-usd (по умолчанию 0)
  # До 25.11 22:00 потрачено 20.20; на день теста потолок поднят до 40.00, расход каждого запуска ограничивает --max-usd.
  total_usd: 40.0
  # единственные модели, к которым разрешены сетевые вызовы
  allow: [claude-haiku-5-5, claude-sonnet-5-5]
  # одновременные запросы; при 429 запросы ждут своей очереди (KURS_LLM_PATIENCE, с), а не падают
  workers: 4
  # набор моделей: senior — граф узлов, задания, маршрутизация; fast — карточки и правки
  # judge — кто сверяет карточки с источником по смыслу (senior | fast | off), judge_rounds — сколько проходов
  # visual — кто составляет описания рисунков, visual_judge — кто сверяет их со смыслом шага (senior | fast | off)
  visual: fast
  visual_judge: senior
  visual_effort: low
  profile: cheap
  profiles:
    cheap:
      models: {anthropic: {senior: claude-haiku-5-5, fast: claude-haiku-5-5}}
      # fast: medium — карточки главы из 18 узлов стоят ≈ $0.16; low дешевле, по качеству не сравнивали
      effort: {senior: medium, fast: medium}
      judge: senior
      judge_rounds: 1
      judge_effort: [medium]   # на формулах с high ответ не умещается: 11 из 18 судей Баренблатта обрезаны
    mid:
      models: {anthropic: {senior: claude-sonnet-5-5, fast: claude-haiku-5-5}}
      effort: {senior: medium, fast: medium}
      judge: senior
      judge_rounds: 1
      judge_effort: [low]
    sonnet:
      models: {anthropic: {senior: claude-sonnet-5-5, fast: claude-sonnet-5-5}}
      effort: {senior: medium, fast: low}
      judge: senior
      judge_rounds: 1
      judge_effort: [low]
    max:
      models: {anthropic: {senior: claude-opus-5-5, fast: claude-sonnet-5-5}}
      effort: {senior: high, fast: medium}
      judge: senior
      judge_rounds: 2
      judge_effort: [medium, low]
  models:
    openai: {senior: gpt-6.2-sol, fast: gpt-6.2-sol}
  # $ за 1 млн токенов; модель без цены не вызывается. Локальный сервер: {input: 0, output: 0}
  prices:
    claude-haiku-5-5: {input: 0.1, cache_write: 0.125, cache_read: 0.01, output: 0.5, long: {over: 100000, times: 5}}
    claude-sonnet-5-5: {input: 2.0, cache_write: 2.5, cache_read: 0.1, output: 10.0}
    claude-opus-5-5: {input: 4.0, cache_write: 5.0, cache_read: 0.2, output: 20.0}

# Смысловые проверки утверждений (kurs/claimcheck.py): отрицание, направление, условие, допущение, обобщение,
# закрытый список причин исключения и «сопоставлено, но не преподано». strict: false — предупреждения, true — ошибки сборки.
# Разово посмотреть строгий режим: kurs check <глава> --strict
checks:
  strict: false

# Модуль «Закладки» (python -m kurs.review): название команды в ответе. Категории и тяжести — по review_output.schema.json, в коде.
review:
  team: Bankai

